<title>Melanie Artavia</title>

<style>
:root{
  --bg:#ffffff; --navy:#0f3b57; --orange:#e87722; --orange-text:#c9600f; --slate:#4a6073; --muted:#7b8d9d; --line:#e3e8ec;
  --btn-wa-bg:#e87722; --btn-wa-fg:#0f3b57; --btn-ig-bg:#0f3b57; --btn-ig-fg:#ffffff; --card:#ffffff;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a2538; --navy:#ffffff; --orange:#f08a3a; --orange-text:#f59a52; --slate:#c3d0da; --muted:#93a6b6; --line:#1d4560;
    --btn-wa-bg:#f08a3a; --btn-wa-fg:#0a2538; --btn-ig-bg:#17496a; --btn-ig-fg:#ffffff; --card:#ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a2538; --navy:#ffffff; --orange:#f08a3a; --orange-text:#f59a52; --slate:#c3d0da; --muted:#93a6b6; --line:#1d4560;
  --btn-wa-bg:#f08a3a; --btn-wa-fg:#0a2538; --btn-ig-bg:#17496a; --btn-ig-fg:#ffffff; --card:#ffffff;
  color-scheme: dark;
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--navy); font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased}
main{max-width:440px; margin:0 auto; padding:56px 24px 40px; display:flex; flex-direction:column; align-items:center; text-align:center; min-height:100vh}
h1{font-weight:800; font-size:clamp(2.1rem,9.5vw,2.7rem); line-height:1.05; letter-spacing:-0.02em; margin:0; color:var(--navy)}
.bar{width:64px; height:6px; border-radius:3px; background:var(--orange); margin:22px 0}
.role{font-weight:300; font-size:1.15rem; line-height:1.5; color:var(--slate); margin:0; max-width:30ch}
.lead{font-weight:600; font-size:1rem; color:var(--muted); margin:40px 0 16px}
.links{width:100%; display:flex; flex-direction:column; gap:14px}
.btn{display:flex; align-items:center; justify-content:center; gap:12px; min-height:58px; padding:0 22px; border-radius:14px; font:inherit; font-weight:800; font-size:1.05rem; text-decoration:none; transition:transform .15s ease, filter .15s ease}
.btn svg{width:24px; height:24px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.wa{background:var(--btn-wa-bg); color:var(--btn-wa-fg)}
.ig{background:var(--btn-ig-bg); color:var(--btn-ig-fg)}
.tt{background:transparent; color:var(--navy); box-shadow:inset 0 0 0 2px var(--navy)}
.btn:hover{transform:translateY(-2px); filter:brightness(1.05)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.tel:focus-visible{outline:3px solid var(--orange); outline-offset:3px}
.tel{margin-top:28px; font-weight:800; font-size:1.6rem; letter-spacing:-0.01em; color:var(--orange-text); text-decoration:none}
.spacer{flex:1}
footer{width:100%; margin-top:48px; padding-top:28px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:16px}
.logo{display:block; width:100%; max-width:340px; height:auto; background:var(--card); border-radius:12px; padding:10px 12px}
.fallback{font-weight:600; color:var(--slate); margin:0}
.note{font-weight:400; font-size:.9rem; line-height:1.5; color:var(--muted); margin:0; max-width:34ch}
@media (prefers-reduced-motion: reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
